# stoltennis.uz — SERVERDA ISHLAYOTGAN host nginx konfiguratsiyasi.
#
# Joyi: /etc/nginx/sites-available/stoltennis.uz  (sites-enabled'da symlink).
# Bu fayl deploy/nginx.conf O'RNIGA ishlatiladi: serverda host nginx TLS'ni
# tutadi va certbot yangilanishi unga bog'langan, shuning uchun compose
# ichidagi nginx servisi o'chirilgan (docker-compose.server.yml).
#
# MUHIM: xavfsizlik headerini o'zgartirsangiz IKKALA faylni ham yangilang —
# bu faylni VA deploy/nginx.conf ni. Faqat bittasini tuzatish bekorchilik.
#
# Qo'shimcha: /etc/nginx/conf.d/uztt-upgrade.conf da WebSocket uchun
# $connection_upgrade map'i turadi (http blokida bo'lishi shart).
#
# nginx 1.24 — `http2 on;` sintaksisi QO'LLAB-QUVVATLANMAYDI,
# `listen 443 ssl http2;` ishlatiladi.


    location / {
        return 301 https://stoltennis.uz$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.stoltennis.uz;

    ssl_certificate     /etc/letsencrypt/live/stoltennis.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoltennis.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://stoltennis.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stoltennis.uz;

    ssl_certificate     /etc/letsencrypt/live/stoltennis.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoltennis.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/stoltennis.access.log;
    error_log  /var/log/nginx/stoltennis.error.log;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # uttf.uz dan kochirilgan rasmlar — diskdan togridan-togri
    location /uttf-import/ {
        alias /opt/uztt/apps/web/public/uttf-import/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
    }

    # Snippet ni ishlatmaymiz: unda proxy_read_timeout 60s bor, WebSocket uchun kam
    location /socket.io/ {
        proxy_pass http://uztt_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=604800";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
    }

    location /audio/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
    }

    # ---- Next.js statik chiqishi ----
    location /_next/static/ {
        proxy_pass http://uztt_web;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        access_log off;
    }

    # ---- Sayt ----
    location / {
        proxy_pass http://uztt_web;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
