# stoltennis.uz — UZTT platformasi (Next.js web + NestJS api, Docker ichida)
# web -> 127.0.0.1:3000, api -> 127.0.0.1:4000
# TLS: certbot boshqaradi (avtomatik yangilanadi)

upstream uztt_web { server 127.0.0.1:3000; keepalive 32; }
upstream uztt_api { server 127.0.0.1:4000; keepalive 32; }

# HTTP: ACME tekshiruvi + HTTPS ga yonaltirish
server {
    listen 80;
    listen [::]:80;
    server_name stoltennis.uz www.stoltennis.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stoltennis.uz$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.stoltennis.uz;

    ssl_certificate     /etc/letsencrypt/live/stoltennis.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoltennis.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://stoltennis.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stoltennis.uz;

    ssl_certificate     /etc/letsencrypt/live/stoltennis.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoltennis.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/stoltennis.access.log;
    error_log  /var/log/nginx/stoltennis.error.log;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # uttf.uz dan kochirilgan rasmlar — diskdan togridan-togri
    location /uttf-import/ {
        alias /opt/uztt/apps/web/public/uttf-import/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
    }

    # Snippet ni ishlatmaymiz: unda proxy_read_timeout 60s bor, WebSocket uchun kam
    location /socket.io/ {
        proxy_pass http://uztt_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # O'yinchi rasmlari: fayl nomida tasodifiy qism bor (o'zgarsa nomi o'zgaradi) — 30 kun immutable
    location /uploads/players/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        # Nest statik xizmati o'zi "max-age=604800" yuboradi — yashirmasak
        # brauzer ikkita bir-biriga zid Cache-Control oladi.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
    }

    location /uploads/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=604800";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
    }

    location /audio/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
    }

    # ---- Next.js statik chiqishi ----
    location /_next/static/ {
        proxy_pass http://uztt_web;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        access_log off;
    }

    # ---- Sayt ----
    location / {
        proxy_pass http://uztt_web;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
