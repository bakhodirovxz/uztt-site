# stoltennis.uz — UZTT platformasi (Next.js web + NestJS api, Docker ichida)
# web -> 127.0.0.1:3000, api -> 127.0.0.1:4000
# TLS: certbot boshqaradi (avtomatik yangilanadi)

# ---- Himoya: IP bo'yicha chegara, qisqa kesh ----
# Chegaralar keng: zal Wi-Fi va mobil operatorlarda ko'p odam bitta IP dan chiqadi, sahifa ochilganda
# Next.js o'nlab oldindan yuklash so'rovini yuboradi. Asosiy yukni qisqa kesh ko'taradi.
limit_req_zone  $binary_remote_addr zone=uztt_page:20m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=uztt_api:20m  rate=50r/s;
limit_req_zone  $binary_remote_addr zone=uztt_login:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=uztt_conn:20m;
limit_req_status 429;
limit_conn_status 429;

# Kirgan foydalanuvchi keshdan o'tmaydi: javobi unga xos bo'lishi mumkin
map $http_cookie $uztt_no_cache {
    default 0;
    "~*(^|;\s*)uztt_(at|rt)=" 1;
}
# Scoreboard va efir sahifalari qidiruvga kirmaydi
map $uri $uztt_robots {
    default "";
    "~^/(control|admin|tv|overlay|screen|card|sb)(/|$)" "noindex, nofollow";
}
proxy_cache_path /var/cache/nginx/uztt levels=1:2 keys_zone=uztt_cache:32m max_size=1g inactive=10m use_temp_path=off;

upstream uztt_web { server 127.0.0.1:3000; keepalive 32; }
upstream uztt_api { server 127.0.0.1:4000; keepalive 32; }

# HTTP: ACME tekshiruvi + HTTPS ga yonaltirish
server {
    listen 80;
    listen [::]:80;
    server_name stoltennis.uz www.stoltennis.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://stoltennis.uz$request_uri;
    }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.stoltennis.uz;

    ssl_certificate     /etc/letsencrypt/live/stoltennis.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoltennis.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://stoltennis.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stoltennis.uz;

    ssl_certificate     /etc/letsencrypt/live/stoltennis.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoltennis.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/stoltennis.access.log;
    error_log  /var/log/nginx/stoltennis.error.log;

    client_max_body_size 25m;
    # Sekin ulanish hujumlari (slowloris); client_*_timeout nginx.conf da
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn uztt_conn 200;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 444; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone=(self): hakam chetlatish sababini ovoz bilan yozadi
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag $uztt_robots always;
    add_header X-Cache-Status $upstream_cache_status always;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css text/x-component application/json application/javascript application/x-javascript application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Skanerlar (.env, .git, *.php ...): javobsiz uziladi, fail2ban (deploy/fail2ban) IP ni bloklaydi
    location ~* (^|/)\.(?!well-known) { access_log /var/log/nginx/stoltennis.access.log; return 444; }
    location ~* \.(php\d?|asp|aspx|jsp|cgi|env|sql|bak|old|tar|gz|zip|rar|7z)$ { return 444; }

    # Brauzer va qidiruv tizimlari shu manzilni so'raydi
    location = /favicon.ico { rewrite ^ /icon.png last; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # uttf.uz dan kochirilgan rasmlar — diskdan togridan-togri
    location /uttf-import/ {
        alias /opt/uztt/apps/web/public/uttf-import/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # Sportchilar surati, asosan bolalar: rasm qidiruviga kirmaydi
        add_header X-Robots-Tag "noimageindex" always;
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        access_log off;
        try_files $uri =404;
    }

    # ---- Scoreboard ----
    # Ro'yxat proxy.ts dagi SB_EXACT bilan bir xil. NestJS'ga emas, web'ga: ruxsatni proxy.ts tekshiradi.
    location ~ ^/api/(action|data|data/check|settings|ads|ads/.+|card|public|history|all|state|telegram-test|pdb/search|pdb/link)$ {
        limit_req zone=uztt_api burst=200 nodelay;
        proxy_pass http://uztt_web;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
    }

    # Jonli oqim (SSE). Snippet ni ishlatmaymiz: unda proxy_read_timeout 60s bor
    location = /sb/events {
        proxy_pass http://uztt_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ---- API ----
    # Kirish: parol tanlashni nginx ham sekinlatadi (API da ham chegara bor)
    location = /api/auth/login {
        limit_req zone=uztt_login burst=30 nodelay;
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
    }
    # Sessiya va scoreboard ko'prigi: keshlanmaydi
    location ~ ^/api/(auth|sb)/ {
        limit_req zone=uztt_api burst=200 nodelay;
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
    }
    # Ommaviy GET javoblari 2 soniya keshlanadi: bir xil so'rovlar oqimi bazaga yetmaydi
    location /api/ {
        limit_req zone=uztt_api burst=200 nodelay;
        proxy_pass http://uztt_api;
        # Snippet ni ishlatmaymiz: unda proxy_buffering off, kesh ishlamaydi
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_cache uztt_cache;
        proxy_cache_key "api|$request_method|$host$request_uri";
        proxy_cache_valid 200 2s;
        proxy_cache_bypass $uztt_no_cache;
        proxy_no_cache $uztt_no_cache;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header X-RateLimit-Limit;
        proxy_hide_header X-RateLimit-Remaining;
        proxy_hide_header X-RateLimit-Reset;
    }

    # Snippet ni ishlatmaymiz: unda proxy_read_timeout 60s bor, WebSocket uchun kam
    location /socket.io/ {
        proxy_pass http://uztt_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # O'yinchi rasmlari: fayl nomida tasodifiy qism bor (o'zgarsa nomi o'zgaradi) — 30 kun immutable
    location /uploads/players/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        # Nest statik xizmati o'zi "max-age=604800" yuboradi — yashirmasak
        # brauzer ikkita bir-biriga zid Cache-Control oladi.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
    }

    location /uploads/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=604800";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
    }

    location /audio/ {
        proxy_pass http://uztt_api;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
    }

    # ---- Next.js statik chiqishi ----
    location /_next/static/ {
        proxy_pass http://uztt_web;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # location add_header ishlatgani uchun server blokidagi
        # xavfsizlik headerlari meros olinmaydi — takrorlaymiz.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        access_log off;
    }

    # ---- Sayt ----
    # Mehmonlar uchun sahifa 10 soniya keshlanadi. Hujum paytida ham, sayt serveri yiqilsa ham
    # (eskirgan nusxa, 10 daqiqagacha) sahifalar ochiladi. _rsc so'rovlari kalitda alohida.
    location / {
        limit_req zone=uztt_page burst=200 nodelay;
        proxy_pass http://uztt_web;
        # Snippet ni ishlatmaymiz: unda proxy_buffering off, kesh ishlamaydi
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_buffer_size 32k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
        proxy_cache uztt_cache;
        proxy_cache_key "web|$request_method|$host$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree|$http_next_url";
        proxy_cache_valid 200 10s;
        proxy_cache_valid 404 5s;
        proxy_cache_bypass $uztt_no_cache;
        proxy_no_cache $uztt_no_cache;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        # Next.js har javobga "no-store" va NEXT_LOCALE qo'yadi; til manzilda (/ru, /en), cookie kerak emas
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
    }
}
