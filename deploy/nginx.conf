# UZTT production nginx konfiguratsiyasi
# TLS sertifikatlari: /etc/nginx/certs/fullchain.pem va privkey.pem
# (Let's Encrypt / certbot bilan olinadi, DOMAIN o'rniga real domen qo'yiladi)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Gzip (brotli uchun nginx moduli kerak — keyin qo'shsa bo'ladi)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # IP bo'yicha chegara: deploy/stoltennis.uz.nginx.conf bilan bir xil
  # Cloudflare orqali kelsa haqiqiy IP: chegara va fail2ban butun Cloudflare'ni emas, o'sha odamni ko'radi.
  # Faqat shu manzillardan kelgan sarlavhaga ishoniladi (https://www.cloudflare.com/ips/).
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  # Serverning o'zidan (yuklama sinovi, monitoring) kelgan so'rov chegaralanmaydi
  geo $uztt_limited { default 1; 127.0.0.1 0; ::1 0; }
  map $uztt_limited $uztt_limit_key { 0 ""; 1 $binary_remote_addr; }
  limit_req_zone  $uztt_limit_key zone=uztt_page:20m rate=30r/s;
  limit_req_zone  $uztt_limit_key zone=uztt_api:20m  rate=50r/s;
  limit_req_zone  $uztt_limit_key zone=uztt_login:10m rate=30r/m;
  limit_conn_zone $uztt_limit_key zone=uztt_conn:20m;
  limit_req_status 429;
  limit_conn_status 429;

  # WebSocket upgrade
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Xavfsizlik headerlari
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;

    client_max_body_size 20m;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn uztt_conn 200;

    location ~* (^|/)\.(?!well-known) { return 444; }
    location ~* \.(php\d?|asp|aspx|jsp|cgi|env|sql|bak|old|tar|gz|zip|rar|7z)$ { return 444; }

    # Scoreboard: ro'yxat proxy.ts dagi SB_EXACT bilan bir xil, ruxsatni proxy.ts tekshiradi
    location ~ ^/api/(action|data|data/check|settings|ads|ads/.+|card|public|history|all|state|telegram-test|pdb/search|pdb/link)$ {
      limit_req zone=uztt_api burst=200 nodelay;
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location = /sb/events {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # API + Socket.io
    location = /api/auth/login {
      limit_req zone=uztt_login burst=30 nodelay;
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
      limit_req zone=uztt_api burst=200 nodelay;
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /socket.io/ {
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Ommaviy media (API konteyneridan). uploads/private bu yo'ldan chiqmaydi —
    # API faqat uploads/public papkasini serve qiladi.
    # O'yinchi rasmlari: fayl nomida tasodifiy qism bor — 30 kun immutable.
    # deploy/stoltennis.uz.nginx.conf bilan bir xil (CLAUDE.md: ikkalasi birga).
    location /uploads/players/ {
      proxy_pass http://api:4000;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=2592000, immutable";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), geolocation=()" always;
    }
    location /uploads/ {
      proxy_pass http://api:4000;
      proxy_cache_valid 200 7d;
      # DIQQAT: location ichida add_header ishlatilsa, server blokidagi
      # barcha add_header MEROS OLINMAYDI. nginx da "inherit" yoq — shuning
      # uchun xavfsizlik headerlari shu yerda takrorlanadi.
      add_header Cache-Control "public, max-age=604800";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), geolocation=()" always;
    }
    location /audio/ {
      proxy_pass http://api:4000;
    }

    # Next.js sayt
    location / {
      limit_req zone=uztt_page burst=200 nodelay;
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
