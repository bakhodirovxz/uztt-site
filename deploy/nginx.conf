# UZTT production nginx konfiguratsiyasi
# TLS sertifikatlari: /etc/nginx/certs/fullchain.pem va privkey.pem
# (Let's Encrypt / certbot bilan olinadi, DOMAIN o'rniga real domen qo'yiladi)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Gzip (brotli uchun nginx moduli kerak — keyin qo'shsa bo'ladi)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # WebSocket upgrade
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Xavfsizlik headerlari
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;

    client_max_body_size 20m;

    # Scoreboard: ro'yxat proxy.ts dagi SB_EXACT bilan bir xil, ruxsatni proxy.ts tekshiradi
    location ~ ^/api/(action|data|data/check|settings|ads|ads/.+|card|public|history|all|state|telegram-test|pdb/search|pdb/link)$ {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location = /sb/events {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }

    # API + Socket.io
    location /api/ {
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
    location /socket.io/ {
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Ommaviy media (API konteyneridan). uploads/private bu yo'ldan chiqmaydi —
    # API faqat uploads/public papkasini serve qiladi.
    # O'yinchi rasmlari: fayl nomida tasodifiy qism bor — 30 kun immutable.
    # deploy/stoltennis.uz.nginx.conf bilan bir xil (CLAUDE.md: ikkalasi birga).
    location /uploads/players/ {
      proxy_pass http://api:4000;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=2592000, immutable";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), geolocation=()" always;
    }
    location /uploads/ {
      proxy_pass http://api:4000;
      proxy_cache_valid 200 7d;
      # DIQQAT: location ichida add_header ishlatilsa, server blokidagi
      # barcha add_header MEROS OLINMAYDI. nginx da "inherit" yoq — shuning
      # uchun xavfsizlik headerlari shu yerda takrorlanadi.
      add_header Cache-Control "public, max-age=604800";
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), geolocation=()" always;
    }
    location /audio/ {
      proxy_pass http://api:4000;
    }

    # Next.js sayt
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
