# /etc/fail2ban/filter.d/uztt-scan.conf
# Skanerlar: nginx ularga 444 qaytaradi (.env, .git, *.php ...). Oddiy foydalanuvchi bu yo'llarni so'ramaydi.
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ [^"]*" 444
ignoreregex =
datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
